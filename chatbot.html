<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - Neo AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>
    <nav class="navbar container">
        <div class="nav-logo">Neo AI</div>
        <div class="nav-links" style="display: flex; align-items: center;">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="clinics.html">Clinics Near Me</a>
            <button id="theme-toggle" class="btn btn-secondary" style="padding: 6px 12px; margin-left: 10px;" aria-label="Toggle dark mode">🌙</button>
        </div>
    </nav>
    <main class="container main-layout animate-fade-in">
        <div class="card"
            style="max-width: 800px; margin: 0 auto; width: 100%; height: 75vh; display: flex; flex-direction: column;">
            <div
                style="display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
                <div
                    style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary-color); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold;">
                    AI</div>
                <div>
                    <h2 style="margin: 0; font-size: 1.2rem;">Clinical AI Assistant</h2>
                    <span style="font-size: 0.85rem; color: var(--success);">● Online</span>
                </div>
            </div>
            <div id="chat-window"
                style="flex: 1; background: var(--bg-color); border-radius: var(--radius-md); margin: 20px 0; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;">
                <div
                    style="background: var(--surface-color); padding: 15px 20px; border-radius: 20px 20px 20px 5px; align-self: flex-start; max-width: 80%; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
                    Hello. I am the Neo AI clinical assistant. I can help explain your diagnosis, provide context on
                    the XAI heatmaps, or answer general questions about dermatological conditions. How can I help you
                    today?
                </div>
            </div>
            <div style="display: flex; gap: 15px;">
                <input type="text" id="chat-input" placeholder="Ask about symptoms, treatments, or the diagnosis..."
                    style="flex: 1; padding: 15px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-family: inherit; font-size: 1rem; outline: none; background: var(--surface-color); color: var(--text-main);">
                <button class="btn btn-primary" id="chat-send" style="padding: 0 30px;">Send</button>
            </div>
        </div>
    </main>
    <script src="config/api_keys.js"></script>
    <script src="js/chatbot.js"></script>
    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const root = document.documentElement;
        
        // Load preference
        if (localStorage.getItem('theme') === 'dark') {
            root.setAttribute('data-theme', 'dark');
            toggleBtn.textContent = '☀️';
        } else {
            root.removeAttribute('data-theme');
            toggleBtn.textContent = '🌙';
        }
        
        toggleBtn.addEventListener('click', () => {
            const isDark = root.getAttribute('data-theme') === 'dark';
            if (isDark) {
                root.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                toggleBtn.textContent = '🌙';
            } else {
                root.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                toggleBtn.textContent = '☀️';
            }
        });
    </script>
</body>

</html>
